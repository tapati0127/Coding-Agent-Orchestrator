[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-qwen-orchestrator"
version = "0.1.0"
description = "Single-container LangGraph/Qwen Code task DAG orchestrator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langgraph==1.2.17",
  "langgraph-cli[inmem]==0.4.38",
  "langgraph-sdk==0.4.9",
  "langchain-openai==1.7.2",
  "pydantic==2.14.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "orchestrator/prompts"
"dashboard" = "orchestrator/dashboard"
"config" = "orchestrator/config"
"skills" = "orchestrator/skills"
