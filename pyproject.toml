[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-orchestrator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "starlette>=0.41,<1",
]

[project.optional-dependencies]
dev = ["langgraph-cli[inmem]>=0.4,<0.5"]

[tool.setuptools]
py-modules = ["graph", "plan_agent", "execute_agent", "reviewer_agent", "llm_cli"]

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.data-files]
config = ["config/*.yaml"]
"config/cli" = ["config/cli/*.yaml"]

# Repository-local skill snapshots used by both CLI backends.
"skills" = ["skills/sources.json"]
"skills/execute/scoped-implementation" = ["skills/execute/scoped-implementation/*"]
"skills/plan/dependency-planning" = ["skills/plan/dependency-planning/*"]
"skills/plan/replan-recovery" = ["skills/plan/replan-recovery/*"]
"skills/plan/repository-discovery" = ["skills/plan/repository-discovery/*"]
"skills/reviewer/evidence-based-review" = ["skills/reviewer/evidence-based-review/*"]
"skills/reviewer/integration-regression" = ["skills/reviewer/integration-regression/*"]
"skills/vendor/ponytail/ponytail" = ["skills/vendor/ponytail/ponytail/*"]
"skills/vendor/superpowers/systematic-debugging" = ["skills/vendor/superpowers/systematic-debugging/*"]
"skills/vendor/superpowers/verification-before-completion" = ["skills/vendor/superpowers/verification-before-completion/*"]
